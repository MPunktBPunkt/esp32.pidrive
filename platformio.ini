[platformio]
default_envs = pidrive-s3
src_dir = src

; Keine [env]-Sektion — siehe esp32.ergo Kommentar (erbliche board-Pflicht).
[common]
build_flags =
  -DFW_VERSION=\"0.4.61-dev\"
  -DHUB_HOST_DEFAULT=\"192.168.178.113\"
  -DHUB_PORT_DEFAULT=8093
  -DDEVICE_NAME_DEFAULT=\"PiDrive-USB\"
  -DFW_TYPE=\"pidrive\"
  -DCORE_DEBUG_LEVEL=0
  -I include
  -I src
  ; Intercept Arduino USBMSC SCSI callbacks for host fingerprinting
  -Wl,--wrap=tud_msc_inquiry_cb
  -Wl,--wrap=tud_msc_capacity_cb
  -Wl,--wrap=tud_msc_test_unit_ready_cb
  -Wl,--wrap=tud_msc_scsi_cb
  ; Mess-fw additionally wraps READ10/WRITE10 (see [env:pidrive-s3-mess])
lib_deps =
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.2.1

; N8R2: 8 MiB flash + 2 MiB quad PSRAM (hu-probe 0.2.35+ / audit 2026-10-21).
; PSRAM ≠ USB↔WiFi coex cure — use for stream rings / diag / Option-b Zeitversatz.
; FULLMENU: Dir zeigt alle Slots (≤32×160 KiB); Body dynamisch; Reread via D+-Cycle.
[env:pidrive-s3]
platform = espressif32@6.4.0
framework = arduino
board = esp32-s3-devkitc-1
board_build.partitions = min_spiffs.csv
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 8MB
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
lib_deps = ${common.lib_deps}
build_unflags =
  -DARDUINO_USB_MODE=1
build_flags =
  ${common.build_flags}
  -DBOARD_HAS_PSRAM
  -DPIDRIVE_GEO_FULLMENU=1
  ; TinyUSB OTG required for USBMSC — MODE=1 (HW CDC) disables MSC
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DARDUINO_USB_MODE=0

; Lab-only L0 geometry (4 MiB / FAT12 clusters) — markers in 0.4.40+.
