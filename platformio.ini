; Measurement FW (L3 geometry): READ10 cmd capture + soft USB detach + situations API.
; Soft USB = tud_disconnect/connect (D+ pull-up). Does NOT cycle VBUS / physical OTG power.
[env:pidrive-s3-mess]
platform = espressif32@6.4.0
framework = arduino
board = esp32-s3-devkitc-1
board_build.partitions = min_spiffs.csv
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 8MB
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
lib_deps = ${common.lib_deps}
build_unflags =
  -DARDUINO_USB_MODE=1
  -DFW_VERSION=\"0.4.61-dev\"
  -DDEVICE_NAME_DEFAULT=\"PiDrive-USB\"
build_flags =
  ${common.build_flags}
  -DBOARD_HAS_PSRAM
  -DFW_VERSION=\"0.4.61-dev\"
  -DPIDRIVE_GEO_L3=1
  -DPIDRIVE_MESS=1
  -Wl,--wrap=tud_msc_read10_cb
  -Wl,--wrap=tud_msc_write10_cb
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DARDUINO_USB_MODE=0
  -DDEVICE_NAME_DEFAULT=\"PiDrive-Mess\"
