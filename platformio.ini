[platformio]
default_envs = pidrive-s3
src_dir = src

; Keine [env]-Sektion — siehe esp32.ergo Kommentar (erbliche board-Pflicht).
[common]
build_flags =
  -DFW_VERSION=\"0.4.36-dev\"
  -DHUB_HOST_DEFAULT=\"192.168.178.113\"
  -DHUB_PORT_DEFAULT=8093
  -DDEVICE_NAME_DEFAULT=\"PiDrive-USB\"
  -DFW_TYPE=\"pidrive\"
  -DCORE_DEBUG_LEVEL=0
  -I include
  -I src
  ; Intercept Arduino USBMSC SCSI callbacks for host fingerprinting
  -Wl,--wrap=tud_msc_inquiry_cb
  -Wl,--wrap=tud_msc_capacity_cb
  -Wl,--wrap=tud_msc_test_unit_ready_cb
  -Wl,--wrap=tud_msc_scsi_cb
lib_deps =
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.2.1

[env:pidrive-s3]
platform = espressif32@6.4.0
framework = arduino
board = esp32-s3-devkitc-1
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
lib_deps = ${common.lib_deps}
build_unflags =
  -DARDUINO_USB_MODE=1
build_flags =
  ${common.build_flags}
  ; TinyUSB OTG required for USBMSC — MODE=1 (HW CDC) disables MSC
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DARDUINO_USB_MODE=0

; Lab-only L0 geometry (4 MiB / FAT12 clusters) — markers in 0.4.40+.
[env:pidrive-s3-l0]
platform = espressif32@6.4.0
framework = arduino
board = esp32-s3-devkitc-1
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
lib_deps = ${common.lib_deps}
build_unflags =
  -DARDUINO_USB_MODE=1
  -DFW_VERSION=\"0.4.36-dev\"
  -DDEVICE_NAME_DEFAULT=\"PiDrive-USB\"
build_flags =
  ${common.build_flags}
  -DFW_VERSION=\"0.4.40-dev\"
  -DPIDRIVE_GEO_L0=1
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DARDUINO_USB_MODE=0
  -DDEVICE_NAME_DEFAULT=\"PiDrive-Lab\"

; Lab L0-16M: true FAT16, 16 MiB disk, 4 MiB slots (L-ladder L2-scale).
