[platformio]
default_envs = pidrive-s3
src_dir = src

; Keine [env]-Sektion — siehe esp32.ergo Kommentar (erbliche board-Pflicht).
[common]
build_flags =
  -DFW_VERSION=\"0.2.5-dev\"
  -DHUB_HOST_DEFAULT=\"192.168.178.113\"
  -DHUB_PORT_DEFAULT=8093
  -DDEVICE_NAME_DEFAULT=\"PiDrive-USB\"
  -DFW_TYPE=\"pidrive\"
  -DCORE_DEBUG_LEVEL=0
  -I include
  -I src
lib_deps =
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.2.1

[env:pidrive-s3]
platform = espressif32@6.4.0
framework = arduino
board = esp32-s3-devkitc-1
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
lib_deps = ${common.lib_deps}
build_unflags =
  -DARDUINO_USB_MODE=1
build_flags =
  ${common.build_flags}
  ; TinyUSB OTG required for USBMSC — MODE=1 (HW CDC) disables MSC
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DARDUINO_USB_MODE=0
